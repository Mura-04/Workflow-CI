name: Machine Learning CI Workflow

on:
  push:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy

    - name: Run Verification using MLflow Project
      run: |
        cd MLProject_Folder
        # Perintah inilah yang dicari oleh reviewer
        mlflow run . --env-manager=local

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        cd MLProject_Folder
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest