name: Machine Learning CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install MLflow & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow conda-pack

    - name: Run MLproject Verification
      run: |
        cd MLProject_Folder
        mlflow run . --env-manager=local